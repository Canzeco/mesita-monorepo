# THE TICKET v4 handshake (MESITA-1090/1092): scan (open→scanned, an
# affirmative staff write), approve / request-fix (the C1 verdict pair, CAS
# on updated_at), the audit-free poll (get-ticket logs an event per read and
# the limiter counts events per ip_hash — a 2-3s poll through it would
# rate-limit the waiter out of their own approve), and validate (payment
# confirmed → the ticket closes). Same code-possession posture as above;
# omitting a stanza here would default verify_jwt=true and 401 the staff app
# at the gateway.
[functions.validate-web-scan-ticket]
verify_jwt = false

[functions.validate-web-approve-ticket]
verify_jwt = false

[functions.validate-web-request-fix]
verify_jwt = false

[functions.validate-web-poll-ticket]
