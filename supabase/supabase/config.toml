# Supabase project config — Mesita
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "yjalywfzdelacdzccpgb"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# LOCAL STACK ONLY. This block configures `supabase start`, not production —
# note the localhost site_url. The hosted project's auth settings (provider
# credentials, SMS OTP length, rate limits, captcha) live in the Supabase
# dashboard and are NOT represented here, so do not run `supabase config
# push` to "sync" them: it would push this file over production, pointing
# site_url at localhost. Auth changes on the hosted project are a human step.
# To check what production actually has, probe it — see Notion Product Rules §I
# § Identity & sign-in.
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# MFA — required only for admin sign-in, kept available so businesses can
# enrol if they want. Admin-side enforcement lives in admin-signin-email.
enable_manual_linking = false

# Email — password only. No magic link, no email OTP. Consumers don't get
# email auth at all; business + admin live here.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Phone — Twilio Programmable Messaging (NOT Twilio Verify, which an earlier
# version of this comment claimed): Supabase sends the code itself through
# the Messaging Service on +16282784122, so the template below is ours.
# Consumers + staff sign in here; businesses + admins never see this
# provider. Twilio Verify is the standing fallback if Mexican carriers
# filter the US long code — see Notion Product Rules §I.
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Mesita code is {{ .Code }}"
max_frequency = "60s"

[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

# OAuth providers — all explicitly disabled. Spec: no Google, no Apple.
[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = true
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

# Per-function overrides. Naming rule: <caller>-<verb>-<noun> (e.g.
# business-web-create-project, consumer-list-tickets). All functions verify the
# JWT except the truly public catalog reads, which rely on RLS to gate
# visibility instead.

# --- Sign-in / accept-invite (post-signin housekeeping per role) ---
#
# These run AFTER the Supabase Auth call lands a session. They set
# app_metadata.role, create the corresponding profile row, and (admin)
# enforce @canzeco.com + MFA. verify_jwt = true gates each to a real
# session.

[functions.business-web-signin-email]
verify_jwt = true

[functions.consumer-web-signin-phone]
verify_jwt = true

[functions.business-web-accept-invite]
verify_jwt = true

# Internal-only (supabase-edgefunc caller). verify_jwt = true so the gateway
# verifies the service_role JWT signature; requireInternalCaller then checks
# role=service_role.
[functions.supabase-edgefunc-discover-places]
verify_jwt = true

# Async media persistence worker — stores source metadata immediately and mirrors
# source images to Supabase Storage in background. Internal-only; invoked by
# supabase-cron-enrich-place-contents (S9) so mirroring runs in its own wall clock.
[functions.supabase-edgefunc-store-place-images]
verify_jwt = true

# Reservationist "attempt 1": places the outbound reservation call via ElevenLabs
# Convai. Internal-only; invoked by consumer-web-create-reservation right after it
# inserts the pending reservation row.
[functions.supabase-edgefunc-reservation-call]
verify_jwt = true

# Wakes reservations parked by the engine: a venue that doesn't answer gets
# attempts_state='scheduled' + next_attempt_at (+5 min if open, ~30 min after it
# next opens — _shared/reservation-retry.ts), because a run can't sleep that
# long. pg_cron job run-reservation-retries fires this every minute with the
# Vault service-role bearer; it hands each due ticket back to the engine.
# Kill switch: select cron.unschedule('run-reservation-retries');
[functions.supabase-cron-reservation-retries]
verify_jwt = true

# --- Memo's data surface (the agent holds NO database client) ---
#
# Memo reads Mesita ONLY through these four endpoints, called via
# _shared/memo-data.ts from consumer-web-ask-memo and admin-web-ask-memo. Each
# owns its SELECT and projects to a public shape, so Memo's reach is a closed
# set you can enumerate instead of an open service-role query capability. All
# read-only — there is deliberately no write endpoint here to add a tool for.
# Documented for operators at admin.mesita.ai/memo-config (Data Access).

# Memo's RAG leg: pool near the caller → embed intent → cosine rank → public
# cards. Embedding vectors and OPENAI_KEY never leave this function. Renamed
# from -recall-lineup by MESITA-1048; the cosine relevance itself is unchanged.
[functions.supabase-edgefunc-recall-places]
verify_jwt = true

# Public catalog lookup by name (status ∈ active,lead) and/or by Google place id
