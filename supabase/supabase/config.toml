# --- validate-web (PUBLIC Validate page; live host still check.mesita.ai/<code>) ---
# verify_jwt deliberately FALSE: the 128-bit tickets.check_code is the whole
# authentication — whoever holds the freshly scanned QR (nominally staff) can
# view, optionally bill (internal control, never a gate — MESITA-850), and
# close the ticket. That includes the guest themselves; a static QR
# screenshot is indistinguishable from a live scan. ACCEPTED: Mesita never
# moves money — the staff apply the discount off this same page — so
# self-service is a data-quality nuisance, not theft. Mitigations are visibility (first_scanned_at on the page,
# ticket_check_events audit with self_view + daily-salted ip_hash, in-EF rate
# limiting, uniform 404s). See _shared/ticket-check.ts.

# MESITA-1117: the 7 check-web-* twins are deleted. Staff callers
# (apps/web-check · apps/web-validate) hit these validate-web-* names.
[functions.validate-web-get-ticket]
verify_jwt = false

