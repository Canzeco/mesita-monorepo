# --- Twilio ---
#
# No Twilio webhook reaches an Edge Function. Twilio serves two rails and
# neither needs one: SMS phone-OTP is delivered by Supabase Auth itself
# ([auth.sms.twilio] above), and voice is the Reservationist's line, whose
# webhooks point at ElevenLabs. The `twilio-webhook` caller is retired with
# the WhatsApp rail that was its only user.
