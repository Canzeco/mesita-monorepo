[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,web_search_advanced_exa"

[mcp_servers.linear-server]
url = "https://mcp.linear.app/mcp"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

# Every command Codex runs in this repo declares its platform (Rules › SADLC adapter contract):
# `deno task worktree add` then files the worktree under ../worktrees/codex/ and the claim line
# reads platform=codex (MESITA-1785).
[shell_environment_policy]
set = { MESITA_PLATFORM = "codex" }

# Redeye (Rules §0): `codex --profile redeye` is mode 5 — no approvals, no sandbox. The other
# half, never ask and never stop, is scripts/redeye.md, which AGENTS.md tells the agent to obey
# when Pato writes `activate Redeye`. A profile alone would be prompts off and an agent still
# stopping to ask which name to use.
[profiles.redeye]
approval_policy = "never"
sandbox_mode = "danger-full-access"
