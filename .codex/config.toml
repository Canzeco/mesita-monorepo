[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,web_search_advanced_exa"

[mcp_servers.linear-server]
url = "https://mcp.linear.app/mcp"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

# Every command Codex runs in this repo declares its platform (Rules › SADLC adapter contract):
# `deno task worktree add` then files the worktree under ../worktrees/codex/ and the claim line
# reads platform=codex (MESITA-1785).
[shell_environment_policy]
set = { MESITA_PLATFORM = "codex" }
