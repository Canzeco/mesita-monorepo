name: rules

# Any markdown change anywhere triggers this workflow: sync-rules:check also
# enforces the Rules §0 markdown allowlist (knowledge → Notion,
# task context → Linear; the repo carries only CLAUDE.md/AGENTS.md + tooling
# config) and the word budgets.
#
# The image formats trigger it too: sync-rules:check rejects any tracked
# .icns/.jxl/.heif/.heic file, the one premise the dismissed image-size
# advisories rest on (MESITA-1077). Adding such an asset is exactly the change
# that must not slip through unrun.
#
# So do the sources the vocabulary ratchet scans (apps/*/src,
# packages/*/src) and the files `deno task test:rules` pins: the workflows
# and .github/required-checks.json.
#
# The extension lists below MUST match MD_SCAN_GLOBS and FORBIDDEN_ASSET_GLOBS
# in scripts/sync-rules.ts — an extension the script scans but this filter omits
# means the workflow never fires, so the gate reports green because it never
# ran. `deno task test:rules` asserts the two stay in step (YAML cannot import
# from TS).
#
# "instruction files in sync" is a required check (.github/required-checks.json);
# renaming the job silently un-guards the branch.
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.mdx"
      - "**/*.mdc"
      - "**/*.icns"
      - "**/*.ICNS"
      - "**/*.jxl"
      - "**/*.JXL"
      - "**/*.heif"
      - "**/*.HEIF"
      - "**/*.heic"
      - "**/*.HEIC"
      - "scripts/**"
      - "apps/*/src/**"
      - "packages/*/src/**"
      - "deno.json"
      - ".github/workflows/**"
      - ".github/required-checks.json"
  # Every PR runs this workflow; the `changes` job decides whether the check
  # has anything to do.
  pull_request: {}

concurrency:
  group: rules-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect rules-scoped changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
      - name: Forced failure (temporary proof of the gate; reverted before merge)
        run: exit 1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            rules:
              - '**/*.md'
              - '**/*.MD'
              - '**/*.mdx'
              - '**/*.mdc'
              - '**/*.icns'
              - '**/*.ICNS'
              - '**/*.jxl'
              - '**/*.JXL'
              - '**/*.heif'
              - '**/*.HEIF'
              - '**/*.heic'
              - '**/*.HEIC'
              - 'scripts/**'
              - 'apps/*/src/**'
              - 'packages/*/src/**'
              - 'deno.json'
              - '.github/workflows/**'
              - '.github/required-checks.json'

  # SKIPPED when the PR touches nothing in scope, which merges. If `changes`
  # fails, its output is empty, not 'false', and the check runs.
  check:
    name: instruction files in sync
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.1

      # The gates guarding the gates. Runs first: a broken enforcement path
      # would otherwise fail below with a message about the wrong thing.
      - name: Test
        run: deno task test:rules

      # The fleet tool and the write gate (scripts/worktree.ts,
      # scripts/preflight.sh) guard every write; this is the only workflow
      # that runs their tests.
      - name: Test the fleet tool and the write gate
        run: deno task test:worktree

      # Redeye arms by editing .claude/settings.local.json — the file holding the
      # permission allow list. An arm that drops that list leaves an agent MORE
      # prompted than before, and nothing reports it: the file is gitignored, so
      # the only symptom is a session that quietly starts asking again.
      - name: Test the Redeye protocol's arming
        run: deno task test:redeye

      - name: Check
        run: deno task sync-rules:check
