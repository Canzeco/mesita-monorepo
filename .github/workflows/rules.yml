name: rules

# Any markdown change anywhere triggers this workflow: sync-rules:check also
# enforces the ASDM §C markdown allowlist (knowledge → Notion, task context →
# Linear; the repo carries only CLAUDE.md/AGENTS.md + tooling config).
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.mdx"
      - "scripts/**"
      - "deno.json"
      - ".github/workflows/rules.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.mdx"
      - "scripts/**"
      - "deno.json"
      - ".github/workflows/rules.yml"

concurrency:
  group: rules-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: instruction files in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      # One checkout covers the whole monorepo — the old per-repo --only
      # self-scoping (and its "cross-repo enforcement stays manual" caveat)
      # is gone with ASDM v5 (MESITA-456).
      - name: Check
        run: deno task sync-rules:check
