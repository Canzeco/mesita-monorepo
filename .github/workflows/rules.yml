name: rules

# Any markdown change anywhere triggers this workflow: sync-rules:check also
# enforces the Rules §0 markdown allowlist (knowledge → Notion,
# task context → Linear; the repo carries only CLAUDE.md/AGENTS.md + tooling
# config) and the word budgets.
#
# The image formats trigger it too: sync-rules:check rejects any tracked
# .icns/.jxl/.heif/.heic file, the one premise the dismissed image-size
# advisories rest on (MESITA-1077). Adding such an asset is exactly the change
# that must not slip through unrun.
#
# The extension lists below MUST match MD_SCAN_GLOBS and FORBIDDEN_ASSET_GLOBS
# in scripts/sync-rules.ts — an extension the script scans but this filter omits
# means the workflow never fires, so the gate reports green because it never
# ran. `deno task test:rules` asserts the two stay in step (YAML cannot import
# from TS).
#
# sync-shared rode here from MESITA-1614 until MESITA-2089 deleted it: with
# web-business gone every target wrote into web-admin alone, so the copies
# became web-admin's own files and no app src/** glob triggers this any more.
#
# The JOB NAME below is load-bearing: "instruction files in sync" is one of the
# six required checks on main. Renaming it silently un-guards the branch.
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.mdx"
      - "**/*.mdc"
      - "**/*.icns"
      - "**/*.ICNS"
      - "**/*.jxl"
      - "**/*.JXL"
      - "**/*.heif"
      - "**/*.HEIF"
      - "**/*.heic"
      - "**/*.HEIC"
      - "scripts/**"
      - "deno.json"
      - ".github/workflows/rules.yml"
  # Unfiltered on `pull_request` (MESITA-1576): a required check a path
  # filter skips never reports, and branch protection blocks a PR on an
  # "Expected" check that will never arrive. The `changes` job below decides
  # per-PR whether there's anything to check.
  pull_request: {}

concurrency:
  group: rules-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect rules-scoped changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rules == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rules:
              - '**/*.md'
              - '**/*.MD'
              - '**/*.mdx'
              - '**/*.mdc'
              - '**/*.icns'
              - '**/*.ICNS'
              - '**/*.jxl'
              - '**/*.JXL'
              - '**/*.heif'
              - '**/*.HEIF'
              - '**/*.heic'
              - '**/*.HEIC'
              - 'scripts/**'
              - 'deno.json'
              - '.github/workflows/rules.yml'

  check:
    name: instruction files in sync
    needs: changes
    # THE JOB ITSELF MUST NEVER BE `if:`-GATED (MESITA-1679 fix, same bug
    # fixed in brand.yml's sibling job). A job-level `if:` that evaluates
    # false means the job does not run AT ALL and posts NO check run — so a
    # PR that touches none of this filter's paths never gets an
    # "instruction files in sync" status, and branch protection blocks it
    # forever on a required check that will never arrive: the exact
    # "Expected check that will never arrive" failure the comment on
    # `pull_request: {}` above already names. MESITA-1576 fixed the TRIGGER
    # (unfiltered on pull_request) but left this job-level `if:` re-creating
    # the identical bug one level down. Gating each STEP instead keeps the
    # job always green-and-reporting while still doing real work only when
    # something in scope changed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.changes.outputs.changed == 'true'
        uses: actions/checkout@v4

      - name: Install Deno
        if: needs.changes.outputs.changed == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      # The gates guarding the gates. Runs first: a broken enforcement path
      # would otherwise fail below with a message about the wrong thing.
      - name: Test
        if: needs.changes.outputs.changed == 'true'
        run: deno task test:rules

      # The fleet tool and the write gate (scripts/worktree.ts, scripts/preflight.sh)
      # ran in no workflow before MESITA-1702: a claim step that had been fatal in
      # every real clone stayed green because only its fixture ever ran it.
      - name: Test the fleet tool and the write gate
        if: needs.changes.outputs.changed == 'true'
        run: deno task test:worktree

      # Redeye arms by editing .claude/settings.local.json — the file holding the
      # permission allow list. An arm that drops that list leaves an agent MORE
      # prompted than before, and nothing reports it: the file is gitignored, so
      # the only symptom is a session that quietly starts asking again.
      - name: Test the Redeye protocol's arming
        if: needs.changes.outputs.changed == 'true'
        run: deno task test:redeye

      # One checkout covers the whole monorepo — the old per-repo --only
      # self-scoping (and its "cross-repo enforcement stays manual" caveat)
      # is gone since MESITA-456.
      - name: Check
        if: needs.changes.outputs.changed == 'true'
        run: deno task sync-rules:check
