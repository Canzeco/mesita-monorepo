name: mock-business-app CI

# The mock console. It HAS a Vercel project since MESITA-1903, so this workflow
# is no longer the only thing that builds it — but it is still the only thing
# that LINTS, TYPECHECKS and (since MESITA-2017) TESTS it, and it is what
# catches a break on a pull request rather than on the deployment that follows
# the merge. The tests pin the product order, the rewards table, the halves
# map and the catalogue copy: the things a fixture app has no runtime to
# refuse.
#
# NOT a required check on main, deliberately: nothing a customer touches ships
# from this package, and blocking a console fix on a mock's build is the tail
# wagging the dog. A red build here means the hosted mock is stale, not that
# main is broken.

on:
  push:
    branches: [main]
    paths:
      - "apps/mock-business-app/**"
      - ".github/workflows/mock-business-app.yml"
  pull_request:
    paths:
      - "apps/mock-business-app/**"
      - ".github/workflows/mock-business-app.yml"

concurrency:
  group: mock-business-app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mock-business-app

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mock-business-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
