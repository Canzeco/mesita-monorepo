# One-shot: cloud-agent gh integration cannot PATCH PR bodies (403). Mirrors
# `deno task worktree pr --docs notion:3bfa9bf37a52816eaa9dc2d7b8b74525` for #1758.
# Remove this file before landing MESITA-1802.
name: tmp pr docs 1802

on:
  push:
    branches:
      - cursor/MESITA-1802-business-list-reviews

permissions:
  pull-requests: write

jobs:
  sync-docs-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const docsLine = "Docs: notion:3bfa9bf37a52816eaa9dc2d7b8b74525";
            const branch = "cursor/MESITA-1802-business-list-reviews";
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: "open",
            });
            if (prs.length === 0) {
              core.info("no open PR for branch");
              return;
            }
            const pr = prs[0];
            const body = pr.body ?? "";
            if (/^Docs: /m.test(body)) {
              core.info(`PR #${pr.number} already has Docs line`);
              return;
            }
            const lines = body.split("\n");
            const closesIdx = lines.findIndex((l) => /^Closes MESITA-\d+/.test(l));
            if (closesIdx >= 0) {
              lines.splice(closesIdx + 1, 0, docsLine);
            } else {
              lines.unshift(docsLine);
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: lines.join("\n"),
            });
            core.info(`added Docs line to PR #${pr.number}`);
