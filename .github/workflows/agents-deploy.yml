name: agents deploy

# The ElevenLabs reservation agents are config-as-code in
# supabase/supabase/functions/_shared/reservationist/ (MESITA-3968, Pato: "have
# all the configuration of eleven labs in a repo to just deploy"). The
# Supabase integration deploys the sync function a few minutes after a push
# to main; this waits for that deploy (supabase/scripts/sync-agents.sh
# compares spec hashes), then pushes the agents. Simulated calls cost
# ElevenLabs credits (MESITA-4134): a push runs ONLY the calls its merge
# commit names, one "Agent-tests: <label>" line each, one at a time,
# stopping at the first failure. No line, no call. A manual run takes
# `tests` (one label per line, or "all"). A sync failure fails the job;
# a failed call is a warning in the job summary.
#
# REQUIRES repo secret SUPABASE_ACCESS_TOKEN (already set for supabase deploy).

on:
  push:
    branches: [main]
    paths:
      - "supabase/supabase/functions/_shared/reservationist/**"
      - "supabase/supabase/functions/supabase-edgefunc-sync-reservationist/**"
      - "supabase/scripts/sync-agents.sh"
      - ".github/workflows/agents-deploy.yml"
  workflow_dispatch:
    inputs:
      tests:
        description: 'Simulated calls to run, one label per line ("all" = the whole suite, costly). Empty = none.'
        required: false
        default: ""

concurrency:
  group: agents-deploy
  cancel-in-progress: true

jobs:
  sync:
    name: sync ElevenLabs agents
    # The job holds the access token, so it never runs a branch's script.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.100.0

      - name: Which simulated calls
        id: pick
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TESTS: ${{ github.event.inputs.tests }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="$INPUT_TESTS"
          else
            list=$(printf '%s\n' "$COMMIT_MESSAGE" | sed -n 's/^[[:space:]*-]*Agent-tests:[[:space:]]*//p')
          fi
          { echo "list<<__EOF__"; printf '%s\n' "$list"; echo "__EOF__"; } >>"$GITHUB_OUTPUT"
          echo "calls: $(printf '%s' "$list" | awk 'NF' | wc -l | tr -d ' ')"

      - name: Wait for the deploy, sync, test
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AGENT_TESTS: ${{ steps.pick.outputs.list }}
        run: supabase/scripts/sync-agents.sh
