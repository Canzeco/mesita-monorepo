name: brand

on:
  push:
    branches: [main]
    paths:
      - "assets/brand/**"
      - "apps/*/src/app/globals.css"
      - "apps/*/src/app/icon.svg"
      - "apps/*/src/components/brand/**"
      - "apps/*/public/brand/**"
      - "apps/*/src/constants/brand.ts"
      - "apps/*/tailwind.config.js"
      - "scripts/sync-brand.ts"
      - "deno.json"
      - ".github/workflows/brand.yml"
  # Unfiltered on `pull_request` (MESITA-1576): a required check a path
  # filter skips never reports, and branch protection blocks a PR on an
  # "Expected" check that will never arrive. The `changes` job below decides
  # per-PR whether there's anything to check.
  pull_request: {}

concurrency:
  group: brand-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect brand-scoped changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ github.event_name != 'pull_request' || steps.filter.outputs.brand == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            brand:
              - 'assets/brand/**'
              - 'apps/*/src/app/globals.css'
              - 'apps/*/src/app/icon.svg'
              - 'apps/*/src/components/brand/**'
              - 'apps/*/public/brand/**'
              - 'apps/*/src/constants/brand.ts'
              - 'apps/*/tailwind.config.js'
              - 'scripts/sync-brand.ts'
              - 'deno.json'
              - '.github/workflows/brand.yml'

  check:
    name: brand assets in sync
    needs: changes
    # THE JOB ITSELF MUST NEVER BE `if:`-GATED (MESITA-1679 fix). A job-level
    # `if:` that evaluates false means the job does not run AT ALL and posts
    # NO check run — so a PR that touches no brand-scoped path never gets a
    # "brand assets in sync" status, and branch protection blocks it forever
    # on a required check that will never arrive. That is exactly the
    # "Expected check that will never arrive" failure mode the comment on
    # `pull_request: {}` above already names — MESITA-1576 fixed the TRIGGER
    # (unfiltered on pull_request) but left this job-level `if:` re-creating
    # the identical bug one level down. Gating each STEP instead keeps the
    # job always green-and-reporting while still doing real work only when
    # something brand-scoped changed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.changes.outputs.changed == 'true'
        uses: actions/checkout@v4

      - name: Install Deno
        if: needs.changes.outputs.changed == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      # Every logo asset, token block, and brand component across the seven
      # apps is generated from assets/brand/brand.json. This fails the build if
      # any of them was hand-edited or left stale — the same contract sync-rules
      # enforces for the instruction files.
      #
      # png/ and pdf/ are NOT checked: they come from
      # scripts/render-brand-raster.mjs, which needs a local browser.
      - name: Check
        if: needs.changes.outputs.changed == 'true'
        run: deno task sync-brand:check
