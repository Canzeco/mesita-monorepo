name: brand

on:
  push:
    branches: [main]
    paths:
      - "assets/brand/**"
      - "apps/*/src/app/globals.css"
      - "apps/*/src/app/icon.svg"
      - "apps/*/src/components/brand/**"
      - "apps/*/public/brand/**"
      - "scripts/sync-brand.ts"
      - "deno.json"
      - ".github/workflows/brand.yml"
  # Every PR runs this workflow; the `changes` job decides whether the check
  # has anything to do.
  pull_request: {}

concurrency:
  group: brand-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect brand-scoped changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.brand }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            brand:
              - 'assets/brand/**'
              - 'apps/*/src/app/globals.css'
              - 'apps/*/src/app/icon.svg'
              - 'apps/*/src/components/brand/**'
              - 'apps/*/public/brand/**'
              - 'scripts/sync-brand.ts'
              - 'deno.json'
              - '.github/workflows/brand.yml'

  # SKIPPED when the PR touches nothing brand-scoped, which merges. If
  # `changes` fails, its output is empty, not 'false', and the check runs.
  check:
    name: brand assets in sync
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.1

      # Every logo asset, token block, and brand component across the three
      # apps is generated from assets/brand/brand.json. This fails the build if
      # any of them was hand-edited or left stale — the same contract sync-rules
      # enforces for the instruction files.
      #
      # png/ and pdf/ are NOT checked: they come from
      # scripts/render-brand-raster.mjs, which needs a local browser.
      - name: Check
        run: deno task sync-brand:check
