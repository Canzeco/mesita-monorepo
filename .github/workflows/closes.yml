name: closes

# Every PR carries the Linear join (Rules I-1, I-3): `Closes MESITA-<id>` in the body,
# and the head branch carries the same id (Rules I-6). It also carries the Docs line
# (Rules I-8): `Docs: notion:<32hex>[,…]` names the Docs page(s) the footprint touched,
# `Docs: none — <why>` says no product knowledge changed, `Docs: handoff notion:<id>`
# says a Work agent rewrites it. `deno task worktree pr` composes both lines; a harness
# draft opens without them and gets them later, which is why `edited` is in the event
# list. Unfiltered on purpose: a required check that a path filter skips blocks the PR
# as "Expected" forever. The body is read through env, never interpolated into the script.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: closes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closes:
    name: PR closes its issue
    runs-on: ubuntu-latest
    steps:
      - name: Body carries Closes MESITA-<id> and a Docs line, and the branch carries the same id
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eq 'Closes MESITA-[0-9]+'; then
            echo "::error::CLOSES MISSING: the PR body has no 'Closes MESITA-<id>' line — the join is the only link between intent and work — run deno task worktree pr, or add the line by hand (Rules I-3)"
            exit 1
          fi
          if ! printf '%s' "$BODY" | grep -Eq '^Docs: (notion:[0-9a-f]{32}(,notion:[0-9a-f]{32})*|none (—|-) .+|handoff notion:[0-9a-f]{32})'; then
            echo "::error::DOCS LINE MISSING: the PR body has no 'Docs:' line — I-8 is read before, rewrite after, and this line is where a PR says which page — 'Docs: notion:<id>[,…]' for the pages the footprint touched, 'Docs: none — <why>' when no product knowledge changed, 'Docs: handoff notion:<id>' when a Work agent rewrites it — run deno task worktree pr --docs …, or add the line by hand (Rules I-8)"
            exit 1
          fi
          ID=$(printf '%s' "$BODY" | grep -Eo 'Closes MESITA-[0-9]+' | head -1 | grep -Eo '[0-9]+')
          if ! printf '%s' "$HEAD" | grep -Eq "MESITA-${ID}([^0-9]|$)"; then
            echo "::error::BRANCH ID MISMATCH: head branch '$HEAD' does not carry MESITA-${ID} — the branch name is the machine-readable claim — git branch -m <prefix>/MESITA-${ID}-<slug> and push (Rules I-6)"
            exit 1
          fi
          echo "ok: Closes MESITA-${ID} on ${HEAD}; $(printf '%s' "$BODY" | grep -E '^Docs: ' | head -1)"
