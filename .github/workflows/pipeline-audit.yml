name: pipeline audit

# The weekly pipeline sweep (MESITA-2391): the checks no PR can run, read
# from the live ruleset, the Actions runs, the cloud functions and the open
# bot PRs. scripts/pipeline-audit.ts lists them. A finding not accepted in
# scripts/pipeline-audit.accepted.json fails the run, and so does a check that
# could not run. `deno task boot` prints this workflow's last run;
# `gh workflow run pipeline-audit.yml` starts one now.
#
# REQUIRES repo secret SUPABASE_ACCESS_TOKEN (the edge-function check).
on:
  # Monday, after supabase-deploy's weekly cleanup (07:23 UTC).
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

# Read-only: every check reads, nothing here writes.
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: pipeline-audit
  cancel-in-progress: false

jobs:
  audit:
    name: pipeline audit
    # The job holds the Supabase token, so it never runs a branch's script.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # What each merge owed and when each function folder left main are
          # read from history.
          fetch-depth: 0
          filter: blob:none

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.100.0

      # The report goes to the job summary as well as the log.
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          deno task pipeline-audit | tee -a "$GITHUB_STEP_SUMMARY"
