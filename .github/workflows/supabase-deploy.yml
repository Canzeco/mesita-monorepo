name: supabase deploy

# Deploy Edge Functions to the singleton Supabase project on every merge to
# main that touches them. Without this, prod EFs silently drift behind main
# until someone hand-redeploys — which has bitten us repeatedly (whole batches
# of admin/consumer/business functions left weeks stale on old _shared code).
#
# Deploys ALL functions (not just changed dirs) because nearly every function
# bundles files from _shared/, so a single _shared change can stale dozens of
# functions at once — a full deploy is the only way to guarantee cloud == repo.
# `supabase functions deploy` honours each function's verify_jwt from
# config.toml, so webhooks/public endpoints keep their intended auth posture.
#
# The Supabase GitHub integration (Deploy to production, MESITA-2075) also
# applies migrations and deploys the config.toml functions on merge. This job
# stays: it is the only place retired slugs get deleted from the cloud.
#
# REQUIRES repo secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables
# → Actions). Runs only on main, after supabase CI (lint · test) has gated the PR.

on:
  push:
    branches: [main]
    paths:
      - "supabase/supabase/functions/**"
      - "supabase/supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: supabase

jobs:
  deploy:
    name: deploy edge functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref yjalywfzdelacdzccpgb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # MESITA-1117: staff callers are validate-web-*. MCP cannot delete a
      # function, so the old check-web-* names stayed live as 410 stubs after
      # the repo pin. This job has SUPABASE_ACCESS_TOKEN; delete is the third
      # of the three deletions (folder · config.toml · cloud). Idempotent:
      # a name already gone is a skip, not a failure. check-web-submit-bill
      # was removed earlier (MESITA-1093).
      # MESITA-1362: Crenup Sourcing get/update EFs — unread after Map became
      # the Search/Add gate.
      # MESITA-1728: the nineteen admin config functions MESITA-1724 collapsed
      # into admin-web-get-config + admin-web-update-config. They were left OUT
      # of this list on purpose for one cycle as a rollback window: deleting a
      # folder does not touch the cloud, so reverting the client half alone
      # would have restored the old behaviour. The window is closed now.
      # MESITA-1722: the three pre-monorepo ghosts. These never had a folder
      # or a config block in this repo at all, so nothing but this list can
      # reach them.
      # MESITA-1723: four functions with no caller left. `functions deploy`
      # only ever ADDS, so a folder deleted in the repo stays callable in the
      # cloud forever unless its slug is named here — the third of the three
      # deletions, same as every entry above.
      # MESITA-1889: the two entitlement doors the org Mesita Membership
      # replaced. business-web-set-org-partnership coupled `partnered` and
      # `mesita_pay_enabled` into one write; business-web-change-subscription
      # sold a per-place Verified subscription no app called.
      # MESITA-2090: the two business-web functions admin's Single Place still
      # called were renamed to admin-web-get-overview / admin-web-update-place
      # when the business console was deleted (MVP First Stage). A rename is a
      # new folder plus the old slug here, or the business name stays callable.
      # The same PR retires the 109 functions no First Stage caller reaches:
      # every remaining business-web-*, all validate-web-*, the Stripe webhook,
      # gift-web-preview-code, and the consumer/admin functions with no caller
      # left (credits, tickets, cards, connectors, consumer-mcp, claims,
      # verification, notifications). Callers are now consumer · admin ·
      # eleven · supabase only.
      # MESITA-2136: no caller left (memo's recall/search/context legs).
      # consumer-web-ask-memo became a stateless OpenAI turn and only
      # supabase-edgefunc-get-memo-config still serves it.
      # THE LOOKUP MATCHES THE WHOLE SLUG CELL. `supabase functions list`
      # prints a `|`-separated table; the old `grep -Fqw` treated a hyphen as a
      # word boundary, so a retired slug also matched any live slug it was a
      # hyphen-bounded prefix of (business-web-create-place inside
      # business-web-create-place-api-key), `functions delete` then failed on
      # the absent name and `set -e` aborted the step. The cell match below
      # cannot; _shared/leftover-efs.test.ts pins it.
      - name: Delete leftover retired functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          leftover=(
            check-web-get-ticket
            check-web-mark-paid
