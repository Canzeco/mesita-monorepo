name: supabase deploy

# The Supabase GitHub integration (Deploy to production, MESITA-2075) is the
# one deployer: on every push to main it applies new migrations and deploys
# every function declared in supabase/supabase/config.toml. Deploying only
# ever adds, so this workflow does the other half: it deletes the cloud
# functions whose folder is gone from main. supabase/scripts/cleanup-retired-efs.sh
# decides which (3 days after the folder's deletion, at most 5 per run).
#
# REQUIRES repo secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables
# → Actions).

on:
  push:
    branches: [main]
    paths:
      - "supabase/supabase/functions/**"
      - "supabase/supabase/config.toml"
      - "supabase/scripts/cleanup-retired-efs.sh"
      - ".github/workflows/supabase-deploy.yml"
  # A folder deleted from main becomes deletable 3 days later, whether or not
  # another supabase merge comes along to run this.
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      max_delete:
        description: Most slugs this run may delete (the script refuses above it)
        type: number
        default: 5
      dry_run:
        description: Print what qualifies and delete nothing
        type: boolean
        default: false

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    name: delete retired edge functions
    # The job holds the access token, so it never runs a branch's script.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the commit comment that announces a deletion
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The 3-day wait reads each folder's deletion date from history.
          fetch-depth: 0
          filter: blob:none

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.100.0

      - name: Delete retired functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MAX_DELETE: ${{ inputs.max_delete }}
          DRY_RUN: ${{ inputs.dry_run && 'yes' || '' }}
          CLEANUP_DELETED_FILE: ${{ runner.temp }}/deleted.txt
        run: supabase/scripts/cleanup-retired-efs.sh ${DRY_RUN:+--dry-run}

      - name: Announce deletions on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DELETED_FILE: ${{ runner.temp }}/deleted.txt
        run: |
          set -euo pipefail
          [ -s "$DELETED_FILE" ] || exit 0
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          slugs=$(sed 's/.*/`&`/' "$DELETED_FILE" | paste -sd ' ' -)
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="Deleted from the cloud by [supabase deploy]($run_url): $slugs. Their folders left main at least 3 days ago." \
            >/dev/null
