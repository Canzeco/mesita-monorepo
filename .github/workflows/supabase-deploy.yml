name: supabase deploy

# Deploy Edge Functions to the singleton Supabase project on every merge to
# main that touches them. Without this, prod EFs silently drift behind main
# until someone hand-redeploys — which has bitten us repeatedly (whole batches
# of admin/consumer/business functions left weeks stale on old _shared code).
#
# Deploys ALL functions (not just changed dirs) because nearly every function
# bundles files from _shared/, so a single _shared change can stale dozens of
# functions at once — a full deploy is the only way to guarantee cloud == repo.
# `supabase functions deploy` honours each function's verify_jwt from
# config.toml, so webhooks/public endpoints keep their intended auth posture.
#
# REQUIRES repo secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables
# → Actions). Runs only on main, after supabase CI (lint · test) has gated the PR.

on:
  push:
    branches: [main]
    paths:
      - "supabase/supabase/functions/**"
      - "supabase/supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: supabase

jobs:
  deploy:
    name: deploy edge functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref yjalywfzdelacdzccpgb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # MESITA-1117: staff callers are validate-web-*. MCP cannot delete a
      # function, so the old check-web-* names stayed live as 410 stubs after
      # the repo pin. This job has SUPABASE_ACCESS_TOKEN; delete is the third
      # of the three deletions (folder · config.toml · cloud). Idempotent:
      # a name already gone is a skip, not a failure. check-web-submit-bill
      # was removed earlier (MESITA-1093).
      # MESITA-1362: Intake Sourcing get/update EFs — unread after Map became
      # the Search/Add gate.
      # MESITA-1728: the nineteen admin config functions MESITA-1724 collapsed
      # into admin-web-get-config + admin-web-update-config. They were left OUT
      # of this list on purpose for one cycle as a rollback window: deleting a
      # folder does not touch the cloud, so reverting the client half alone
      # would have restored the old behaviour. The window is closed now.
      # MESITA-1722: the three pre-monorepo ghosts. These never had a folder
      # or a config block in this repo at all, so nothing but this list can
      # reach them; their source is archived under retired/edge-functions/.
      # MESITA-1723: four functions with no caller left. `functions deploy`
      # only ever ADDS, so a folder deleted in the repo stays callable in the
      # cloud forever unless its slug is named here — the third of the three
      # deletions, same as every entry above.
      - name: Delete leftover retired functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          leftover=(
            check-web-get-ticket
            check-web-mark-paid
            check-web-scan-ticket
            check-web-approve-ticket
            check-web-request-fix
            check-web-poll-ticket
            check-web-validate-ticket
            admin-web-get-sourcing-config
            admin-web-update-sourcing-config
            admin-web-get-config-sample
            business-web-list-categories
            business-web-list-tags
            business-web-list-reservations
            admin-web-review-refund-request
            business-web-request-refund
            business-web-update-cfdi
            admin-web-get-controls-config
            admin-web-get-discovery-config
            admin-web-get-models-config
            admin-web-get-ojo-config
            admin-web-get-orders-config
            admin-web-get-reservations-config
            admin-web-get-rewards-config
            admin-web-get-verification-config
            admin-web-get-visits-config
            admin-web-update-controls-config
            admin-web-update-discovery-config
            admin-web-update-enricher-config
            admin-web-update-models-config
            admin-web-update-ojo-config
            admin-web-update-orders-config
            admin-web-update-reservations-config
            admin-web-update-rewards-config
            admin-web-update-verification-config
            admin-web-update-visits-config
          )
          listed=$(supabase functions list --project-ref yjalywfzdelacdzccpgb)
          echo "$listed"
          for fn in "${leftover[@]}"; do
            if echo "$listed" | grep -Fqw "$fn"; then
              echo "deleting $fn"
              supabase functions delete "$fn" --project-ref yjalywfzdelacdzccpgb --yes
            else
              echo "$fn already absent"
            fi
          done
