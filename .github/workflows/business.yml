name: business CI

on:
  push:
    branches: [main]
    paths:
      - "apps/business/**"
      - ".github/workflows/business.yml"
  pull_request:
    paths:
      - "apps/business/**"
      - ".github/workflows/business.yml"

concurrency:
  group: business-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/business

jobs:
  check:
    name: typecheck · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/business/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Lint runs but does not block merge: the business app currently has a
  # known-red eslint baseline (react-hooks/set-state-in-effect) in
  # UnitDock.tsx and PlaceCategorySelect.tsx. Once fixed, fold this job's
  # `run` back into the `check` job above as a blocking step.
  lint:
    name: lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/business/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
