name: supabase CI

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  # Every PR runs this workflow; the `changes` job decides whether the jobs
  # below have anything to do.
  pull_request: {}
  # This suite can go red with NO commit touching it, and the path filters
  # above mean nothing would run to find out: main reads green while it is
  # broken, and the next PR to touch supabase/** inherits the red. Two ways
  # that happens here and nowhere else in this repo:
  #   · these EFs import jsr:/npm:/https: UNPINNED by design (see the lint
  #     exclusions below), so an upstream release can break them on its own;
  #   · a date-relative fixture can simply come due against a frozen `NOW`.
  # Every apps/web-* package pins through a lockfile and cannot drift this
  # way, so the clock-driven run belongs on this one package, not repo-wide.
  # Off-peak minute: GitHub queues :00 heavily. Note GitHub disables cron on
  # repos with no activity for 60 days.
  schedule:
    - cron: "17 6 * * *"
  # Same job on demand, without waiting for the cron.
  workflow_dispatch:

concurrency:
  # `event_name` keeps the scheduled run in its own lane. Without it a cron
  # firing during a push to main shares this group and one cancels the other,
  # which is exactly the "nothing ran and nobody noticed" failure above.
  # PR-to-PR cancellation is unchanged: same ref, same event.
  group: supabase-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: supabase/supabase/functions

jobs:
  # Decides once whether a PR touches what this suite reads, so the three jobs
  # below need no checkout and diff of their own. Every other event (push to
  # main, the nightly run, a dispatch) runs everything.
  changes:
    name: detect supabase changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - name: Forced failure (temporary proof of the gate; reverted before merge)
        run: exit 1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            supabase:
              - 'supabase/**'
              - '.github/workflows/supabase.yml'
              # Tests in this suite STRING-SCAN the two apps:
              # `config-section-callers.test.ts` reads web-admin's source,
              # `place-families-parity.test.ts` reads web-consumer's family
              # twin and forbids the retired family vocabulary across both,
              # and `ef-caller-acl.test.ts` checks every EF call site. A PR
              # that touches only apps/** must still run them. Anything a
              # supabase test reads belongs in this filter.
              - 'apps/web-admin/src/**'
              - 'apps/web-consumer/src/**'

  # The three jobs below are SKIPPED when the PR touches nothing in the filter,
  # which merges. If `changes` fails, its output is empty, not 'false', and
  # they run.
  check:
    name: deno lint · test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.1

      # Supabase edge functions intentionally use unpinned jsr:/npm: and
      # https:// import specifiers (per Supabase's own EF docs), so the
      # no-unversioned-import / no-import-prefix rules are excluded — every
      # other lint rule stays enforced and blocking.
      - name: Lint
        run: deno lint --rules-exclude=no-unversioned-import,no-import-prefix

      - name: Test
        run: deno test --allow-all

      # `supabase functions deploy` builds its list from config.toml's
      # [functions.*] blocks, NOT from the folders on disk, and aborts the whole
      # run on the first block whose entrypoint is missing: every function after
      # it is skipped. The deploy runs after the merge, so the check runs on the
      # PR (MESITA-1286).
      #
      # One direction only: a folder with no block is fine (config defaults
      # apply).
      - name: Every declared function has a folder
        working-directory: supabase/supabase
        run: |
          missing=$(grep -oE '^\[functions\.[^]]+\]' config.toml \
            | sed -E 's/^\[functions\.(.*)\]$/\1/' \
            | while read -r fn; do [ -f "functions/$fn/index.ts" ] || echo "$fn"; done)
          if [ -n "$missing" ]; then
            echo "config.toml declares functions with no functions/<name>/index.ts:"
            echo "$missing"
            echo "supabase functions deploy aborts on the first one, deploying nothing after it."
            exit 1
          fi

  # Full type-check of every edge function against its remote (jsr/npm/https)
  # imports. Blocking: the `check` job above resolves the same remote imports,
  # so a registry outage fails CI either way, and a check that sits red on main
  # can no longer tell "you broke it" from "it was already broken"
  # (MESITA-1139).
  #
  # Scope is the whole `supabase` package, not just `functions/` — the step below
  # overrides the job default. `scripts/` imports freely from `functions/_shared`,
  # so a sweep that deletes an export there breaks a script that CI would
  # otherwise never load.
  typecheck:
    name: deno check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.1

      - name: Check
        working-directory: supabase
        run: deno check .

  # SQL invariants against a database built from every migration.
  #
  # The Deno suite never opens Postgres, so without this job every schema
  # guarantee is convention: `profiles` keeps security_invoker, `places.name`
  # stays generated, `admin_reset_database` finds its survivors registered.
  # Migrations carry DO-block assertions, but they only see the world at the
  # moment they run; this job runs after the LAST migration, so it sees the
  # schema that ships (MESITA-1050). pgTAP also reads public pg_proc.prosrc for
  # retired column names, which covers LANGUAGE sql and EXECUTE text inside
  # function bodies (MESITA-1720).
  #
  # Blocking. If Postgres will not come up, the migration set is broken and
  # that IS the finding — merging past it deploys the same breakage. Do not
  # add continue-on-error (MESITA-1139).
  #
  # Cost: `-x` drops every container except Postgres (and auth, which the CLI
  # always starts), and a PR outside the filter never pays for it. Not
  # `supabase db lint` on a shadow DB, for the same cost reason.
  schema:
    name: pgTAP · schema invariants
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned: resolving "latest" costs an unauthenticated GitHub API call,
      # rate-limited per runner IP.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.100.0

      - name: Start Postgres and replay every migration
        working-directory: supabase
        # setup-cli exports SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io, which
        # disables the CLI's ECR → GHCR → Docker Hub fallback. GHCR's
        # anonymous quota is what is returning toomanyrequests on every PR.
        # Docker Hub is the other public mirror of the same images.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          # A rate-limited registry answers in a few seconds. The CLI's own
          # retries stay inside that window. Five misses still fail the job
          # (MESITA-1139).
          for i in 1 2 3 4 5; do
            if supabase start -x studio,imgproxy,edge-runtime,functions,realtime,storage,inbucket,vector,analytics,meta; then
              exit 0
            fi
            echo "supabase start failed (try $i/5); sleeping $((i * 30))s"
            sleep $((i * 30))
          done
          exit 1

      - name: Run pgTAP
        working-directory: supabase
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: supabase test db --local supabase/tests/database
