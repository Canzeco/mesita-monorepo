name: supabase CI

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: supabase/supabase/functions

jobs:
  check:
    name: deno lint · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      # Supabase edge functions intentionally use unpinned jsr:/npm: and
      # https:// import specifiers (per Supabase's own EF docs), so the
      # no-unversioned-import / no-import-prefix rules are excluded — every
      # other lint rule stays enforced and blocking.
      - name: Lint
        run: deno lint --rules-exclude=no-unversioned-import,no-import-prefix

      - name: Test
        run: deno test --allow-all

  # The instruction-file sync check (scripts/sync-rules.ts --check) lives in
  # the root `rules` workflow (.github/workflows/rules.yml) since ASDM v5
  # (MESITA-456) — one checkout now covers the whole monorepo.

  # Full type-check of every edge function against its remote (jsr/npm/https)
  # imports.
  #
  # This was non-blocking, on the reasoning that a registry hiccup should not
  # block a merge. That protected nothing: the `test` job above is blocking and
  # resolves the same remote imports, so a registry outage already fails CI. All
  # the exemption bought was a job that sat red on main for weeks, at which point
  # it could no longer distinguish "you broke it" from "it was already broken" —
  # and #924 shipped a contract change past it that took every create path down
  # for 11 days (MESITA-1139). A gate nobody can read is not a gate. Blocking.
  #
  # Scope is the whole `supabase` package, not just `functions/` — the step below
  # overrides the job default. `scripts/` imports freely from `functions/_shared`,
  # so a sweep that deletes an export there breaks a script that CI would
  # otherwise never load (that is how two linklab runners sat broken for weeks).
  typecheck:
    name: deno check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      - name: Check
        working-directory: supabase
        run: deno check .

  # ⚠ PARKED — this job cannot go green yet. `supabase start` dies replaying
  # 0036_coupon_snapshot_two_tiers.sql ("relation public.coupons does not
  # exist"): the repo's migration files no longer rebuild the database from
  # zero, because the CLI replays the whole `00NN` series before every
  # timestamped file and `coupons` is only created ~26 files later. That is
  # MESITA-1278, and it has to land before this job can be a gate. Nothing
  # below is wrong — it is waiting on a replayable history. Do NOT make it
  # non-blocking to merge it: a gate nobody can read is not a gate.
  #
  # SQL invariants, tested against a database built from every migration.
  #
  # The 512 deno tests never touch a database, so until now every schema
  # guarantee was protected by convention: `profiles` (née `projects_view`) must
  # keep security_invoker, `places.name` must stay a generated column behind its
  # CHECK, `admin_reset_database` must find its survivors registered. Migrations
  # do carry DO-block assertions — that is the posture Pato picked over this
  # harness in /plan-eng-review (2026-08-09, Issue 5, option 5A) — but they only
  # see the world at the moment they run. The failure that actually happened is
  # the one they cannot see: 20260712040000 dropped security_invoker off a
  # projects_view rebuild and it went unnoticed until an audit, months after the
  # migration that asserted it had passed. This job runs after the LAST
  # migration, so it sees the schema that ships (MESITA-1050).
  #
  # Blocking, same reasoning as `deno check` above: a gate nobody can read is
  # not a gate. If Postgres will not come up, the migration set is broken and
  # that IS the finding — merging past it deploys the same breakage.
  #
  # Cost containment: `-x` drops every container except Postgres (and auth,
  # which the CLI always starts), and the whole workflow is path-filtered to
  # `supabase/**`, so a web-only PR never pays for it.
  schema:
    name: pgTAP · schema invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # `start` on a fresh volume applies every migration in order and then
      # seed.sql, so a migration that cannot replay from zero fails right here.
      - name: Start Postgres and replay every migration
        working-directory: supabase
        run: supabase start -x studio,imgproxy,edge-runtime,functions,realtime,storage,inbucket,vector,analytics,meta,kong,rest

      - name: Run pgTAP
        working-directory: supabase
        run: supabase test db --local supabase/tests/database
