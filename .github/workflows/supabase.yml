name: supabase CI

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  # MESITA-1379. This suite can go red with NO commit touching it, and the
  # path filters above mean nothing would run to find out — main reads green
  # while it is broken, and the next PR to touch supabase/** inherits the red.
  # Two ways that happens here and nowhere else in this repo:
  #   · these EFs import jsr:/npm:/https: UNPINNED by design (see the lint
  #     exclusions below), so an upstream release can break them on its own;
  #   · a date-relative fixture can simply come due — a `promo_paused_until`
  #     ten days past a FROZEN `NOW` turned place-promoting.test.ts red on
  #     2026-08-31 and stayed invisible until an unrelated PR ran this job.
  # Every apps/web-* package pins through a lockfile and cannot drift this
  # way, so the clock-driven run belongs on this one package, not repo-wide.
  # Off-peak minute: GitHub queues :00 heavily. Note GitHub disables cron on
  # repos with no activity for 60 days.
  schedule:
    - cron: "17 6 * * *"
  # Same job on demand, without waiting for the cron.
  workflow_dispatch:

concurrency:
  # `event_name` keeps the scheduled run in its own lane. Without it a cron
  # firing during a push to main shares this group and one cancels the other,
  # which is exactly the "nothing ran and nobody noticed" failure above.
  # PR-to-PR cancellation is unchanged: same ref, same event.
  group: supabase-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: supabase/supabase/functions

jobs:
  check:
    name: deno lint · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      # Supabase edge functions intentionally use unpinned jsr:/npm: and
      # https:// import specifiers (per Supabase's own EF docs), so the
      # no-unversioned-import / no-import-prefix rules are excluded — every
      # other lint rule stays enforced and blocking.
      - name: Lint
        run: deno lint --rules-exclude=no-unversioned-import,no-import-prefix

      - name: Test
        run: deno test --allow-all

      # `supabase functions deploy` builds its list from config.toml's
      # [functions.*] blocks, NOT from the folders on disk, and aborts the whole
      # run on the first block whose entrypoint is missing — every function
      # after it is skipped. Three orphan blocks left behind by two EF deletions
      # (#1170, #1171) froze prod EFs across four merges before anyone noticed
      # (MESITA-1286), because the deploy job is the only place that reads them
      # and it runs after the merge. So the check runs on the PR.
      #
      # One direction only: a folder with no block is fine (config defaults
      # apply). Deleting an EF is THREE deletions — the folder, this block, and
      # the cloud function.
      - name: Every declared function has a folder
        working-directory: supabase/supabase
        run: |
          missing=$(grep -oE '^\[functions\.[^]]+\]' config.toml \
            | sed -E 's/^\[functions\.(.*)\]$/\1/' \
            | while read -r fn; do [ -f "functions/$fn/index.ts" ] || echo "$fn"; done)
          if [ -n "$missing" ]; then
            echo "config.toml declares functions with no functions/<name>/index.ts:"
            echo "$missing"
            echo "supabase functions deploy aborts on the first one, deploying nothing after it."
            exit 1
          fi

      # MESITA-1117: staff callers are validate-web-*. A leftover check-web-*
      # folder or config.toml block would re-deploy the old name and strand
      # the live staff bundle on two parallel function sets.
      - name: No leftover check-web functions
        working-directory: supabase/supabase
        run: |
          leftovers=$(
            {
              find functions -maxdepth 1 -type d -name 'check-web-*' 2>/dev/null
              grep -E '^\[functions\.check-web-' config.toml || true
            } | sed '/^$/d'
          )
          if [ -n "$leftovers" ]; then
            echo "leftover check-web-* still in the repo (MESITA-1117):"
            echo "$leftovers"
            exit 1
          fi

      # MESITA-1362: Intake Sourcing get/update EFs are gone. A leftover
      # folder or config.toml block would re-deploy the unread matrix.
      - name: No leftover sourcing-config functions
        working-directory: supabase/supabase
        run: |
          leftovers=$(
            {
              find functions -maxdepth 1 -type d \( -name 'admin-web-get-sourcing-config' -o -name 'admin-web-update-sourcing-config' \) 2>/dev/null
              grep -E '^\[functions\.admin-web-(get|update)-sourcing-config\]' config.toml || true
            } | sed '/^$/d'
          )
          if [ -n "$leftovers" ]; then
            echo "leftover sourcing-config EFs still in the repo (MESITA-1362):"
            echo "$leftovers"
            exit 1
          fi

  # The instruction-file sync check (scripts/sync-rules.ts --check) lives in
  # the root `rules` workflow (.github/workflows/rules.yml) since ASDM v5
  # (MESITA-456) — one checkout now covers the whole monorepo.

  # Full type-check of every edge function against its remote (jsr/npm/https)
  # imports.
  #
  # This was non-blocking, on the reasoning that a registry hiccup should not
  # block a merge. That protected nothing: the `test` job above is blocking and
  # resolves the same remote imports, so a registry outage already fails CI. All
  # the exemption bought was a job that sat red on main for weeks, at which point
  # it could no longer distinguish "you broke it" from "it was already broken" —
  # and #924 shipped a contract change past it that took every create path down
  # for 11 days (MESITA-1139). A gate nobody can read is not a gate. Blocking.
  #
  # Scope is the whole `supabase` package, not just `functions/` — the step below
  # overrides the job default. `scripts/` imports freely from `functions/_shared`,
  # so a sweep that deletes an export there breaks a script that CI would
  # otherwise never load (that is how two linklab runners sat broken for weeks).
  typecheck:
    name: deno check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      - name: Check
        working-directory: supabase
        run: deno check .

  # SQL invariants against a database built from every migration.
  #
  # The Deno suite never opens Postgres, so until this job every schema
  # guarantee was convention: `profiles` keeps security_invoker, `places.name`
  # stays generated, `admin_reset_database` finds its survivors registered.
  # Migrations carry DO-block assertions (the 5A posture from /plan-eng-review
  # 2026-08-09, Issue 5) but they only see the world at the moment they run.
  # The failure that actually happened is the one they cannot see:
  # 20260712040000 dropped security_invoker off a projects_view rebuild and it
  # went unnoticed until an audit. This job runs after the LAST migration, so
  # it sees the schema that ships (MESITA-1050).
  #
  # Blocking. If Postgres will not come up, the migration set is broken and
  # that IS the finding — merging past it deploys the same breakage. Do not
  # add continue-on-error (MESITA-1139).
  #
  # Cost: `-x` drops every container except Postgres (and auth, which the CLI
  # always starts). Path-filtered to `supabase/**`, so a web-only PR never
  # pays for it.
  #
  # MESITA-1191 D3b: this job is NOT `supabase db lint` on a shadow DB. That
  # would reverse the settled CI-cost posture. Stale PL/pgSQL is caught by
  # doctor 2.10 (plpgsql_check + the grep that covers EXECUTE / LANGUAGE sql /
  # cron.job.command) plus a same-session rebuild in the rename migration.
  #
  # MESITA-1296: when these jobs report, main-protection should require
  # `deno lint · test`, `deno check`, `pgTAP · schema invariants`, plus
  # `instruction files in sync` and `brand assets in sync`. Unreported
  # path-filtered checks must not block. The GitHub token on this runner
  # cannot PUT the ruleset (403); the law is the names, the click is residue.
  schema:
    name: pgTAP · schema invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned: resolving "latest" costs an unauthenticated GitHub API call,
      # rate-limited per runner IP, and already failed this job once
      # (run 32626825469).
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.100.0

      - name: Start Postgres and replay every migration
        working-directory: supabase
        run: supabase start -x studio,imgproxy,edge-runtime,functions,realtime,storage,inbucket,vector,analytics,meta

      - name: Run pgTAP
        working-directory: supabase
        run: supabase test db --local supabase/tests/database
