# Monthly, per install root: one grouped minor-and-patch PR, each major in its
# own PR, and security updates grouped in one PR. No bot PR can pass the
# required `PR closes its issue` check, so an agent re-lands each month's set
# under one Linear issue. supabase/ is Deno, which Dependabot does not read.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web-admin
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web-consumer
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web-landing
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packages/place-profile
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /render
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # `/` reads .github/workflows; the composite actions live one level down.
  # Third-party actions are pinned by commit SHA with the version in a comment,
  # and Dependabot moves both.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
