# Explicit app roots only — web-admin, web-consumer and web-landing. MESITA-2089 deleted
# the other four apps (git history keeps them); a root that no longer exists must not be listed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web-admin
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web-consumer
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web-landing
    schedule:
      interval: weekly
