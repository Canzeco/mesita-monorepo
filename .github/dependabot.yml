# Monthly, per install root: one grouped minor-and-patch PR, each major in its
# own PR, and security updates grouped in one PR. No bot PR can pass the
# required `PR closes its issue` check, so an agent re-lands each month's set
# under one Linear issue. supabase/ is Deno, which Dependabot does not read.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web-admin
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web-consumer
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web-landing
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]


  - package-ecosystem: npm
    directory: /apps/web-business
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web-visit
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
  # Expo pins the versions of everything below to the SDK (`expo install
  # --check` in mobile.yml): those move in an SDK upgrade, its own issue.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "eslint"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "jest"
      - dependency-name: "jest-expo"
      - dependency-name: "@types/jest"
      - dependency-name: "react"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native*"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "@stripe/stripe-react-native"
      - dependency-name: "typescript"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packages/place-profile
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /render
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # `/` reads .github/workflows; the composite actions live one level down.
  # Third-party actions are pinned by commit SHA with the version in a comment,
  # and Dependabot moves both.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
