# Explicit app roots only — web-admin and web-consumer. MESITA-2089 deleted the other five
# apps (git history keeps them); a root that no longer exists must not be listed here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web-admin
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web-consumer
    schedule:
      interval: weekly
