# A fresh app with location allowed: each phone has its own word.
appId: com.mesita.consumer
---
- runFlow:
    when: { platform: iOS }
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
          permissions: { location: inuse }
- runFlow:
    when: { platform: Android }
    commands:
      - launchApp:
          clearState: true
          permissions: { location: allow }
