# Every screen a guest sees signed out, in its main and its empty state. It
# touches no real place: no Reserve, Buy or Pay, and it opens no place.
appId: com.mesita.consumer
---
- runFlow: shared/launch-deny.yaml
- extendedWaitUntil: { visible: "Just browse", timeout: 30000 }
- takeScreenshot: welcome
- tapOn: "Just browse"
- extendedWaitUntil: { visible: "Choose location", timeout: 30000 }
- takeScreenshot: home-empty
- tapOn: "Choose location"
- assertVisible: "Use my location.*"
- takeScreenshot: location
- tapOn: { id: "use-device" }
- tapOn: { text: "(Don.t allow|Deny)", optional: true }
- extendedWaitUntil: { visible: ".*Location is off for Mesita.*", timeout: 10000 }
- takeScreenshot: location-denied
- runFlow: shared/launch-allow.yaml
- extendedWaitUntil: { visible: "Just browse", timeout: 30000 }
- takeScreenshot: welcome
- tapOn: "Just browse"
- extendedWaitUntil: { visible: "Choose location", timeout: 30000 }
- tapOn: "Choose location"
# The fix is set again here. The one before launch is not always the one
# the provider reads once the guest asks.
- setLocation:
    latitude: 25.6490
    longitude: -100.3590
- tapOn: { id: "use-device" }
- tapOn: { text: "While using the app", optional: true }
- extendedWaitUntil:
    notVisible: "Tap to share where you are"
    timeout: 30000
- runFlow:
    when:
      visible: "Your location could not be found.*"
    commands:
      - setLocation:
          latitude: 25.6490
          longitude: -100.3590
      - tapOn: { id: "use-device" }
      - extendedWaitUntil:
          notVisible: "Tap to share where you are"
          timeout: 30000
# The Android emulator's provider returns no fix, so that phone screenshots
# the failure and goes on. A catalog, on either phone, must show one amount
# and one time. Categories is on Home.
- runFlow:
    when:
      visible: "Your location could not be found.*"
    commands:
      - takeScreenshot: location-no-fix
      - tapOn: "Close"
      - takeScreenshot: home-no-fix
- runFlow:
    when:
      visible:
        id: "catalog"
    commands:
      - scrollUntilVisible:
          element: { id: "place-price" }
          direction: DOWN
          timeout: 20000
      - assertVisible:
          id: "place-price"
          text: '^\$+$'
      - scrollUntilVisible:
          element: { id: "place-hours" }
          direction: DOWN
          timeout: 20000
      - assertVisible:
          id: "place-hours"
          text: '^· (opens|until) .*[0-9]{1,2}:[0-9]{2}$'
      - takeScreenshot: home
      - tapOn: { id: "menu" }
      - takeScreenshot: categories
      - tapOn: "Close"
- tapOn: "Search"
- takeScreenshot: search
- tapOn: "Sign"
- extendedWaitUntil: { visible: "Text me the code", timeout: 10000 }
# Before anything is typed: typed values stay out of every artifact.
- takeScreenshot: sign-in
- runFlow: { file: shared/link.yaml, env: { LINK: "mesita://gate/update" } }
- extendedWaitUntil: { visible: "Update Mesita", timeout: 15000 }
- takeScreenshot: update
- runFlow: { file: shared/link.yaml, env: { LINK: "mesita://gate/suspended" } }
- extendedWaitUntil: { visible: "Your account is suspended", timeout: 15000 }
- takeScreenshot: suspended
- runFlow: { file: shared/link.yaml, env: { LINK: "mesita://gate/onboarding" } }
- extendedWaitUntil: { visible: "Almost there.", timeout: 15000 }
- takeScreenshot: onboarding
