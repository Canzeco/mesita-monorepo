# Launch, sign in with the test number, finish onboarding if it is shown, see
# the tabs, sign out. No screenshot while a number or a code is on screen.
appId: com.mesita.consumer
---
- runFlow: shared/launch-deny.yaml
- extendedWaitUntil: { visible: "Just browse", timeout: 30000 }
- tapOn: "Just browse"
- tapOn: "Sign"
- tapOn: { id: "phone" }
- inputText: ${MAESTRO_TEST_PHONE}
- tapOn: "Text me the code"
- extendedWaitUntil: { visible: { id: "code" }, timeout: 20000 }
# Six digits sign in by themselves.
- inputText: ${MAESTRO_TEST_CODE}
- runFlow:
    when: { visible: "Almost there." }
    commands:
      - tapOn: { id: "first-name" }
      - inputText: "Test"
      - tapOn: { id: "last-name" }
      - inputText: "Guest"
      # iOS shows no dismiss key, and the year sits under the keyboard.
      - tapOn: "Almost there."
      - scrollUntilVisible: { element: { id: "birth-year" }, direction: DOWN }
      - tapOn: "Other"
      - tapOn: { id: "birth-year" }
      - scrollUntilVisible: { element: "1990" }
      - tapOn: "1990"
      - tapOn: { id: "save-details" }
- extendedWaitUntil: { visible: "Home", timeout: 30000 }
- tapOn: "Me"
- extendedWaitUntil: { visible: "Sign out", timeout: 30000 }
- assertVisible: "Class"
- assertVisible: "Home"
- assertVisible: "Search"
- tapOn: { id: "sign-out" }
# iOS leaves the row and the dialog button both named Sign out, and the
# first match is the row, so the dialog stays up.
- runFlow:
    when: { platform: iOS }
    commands:
      - tapOn:
          text: "Sign out"
          below: "Sign out?"
- runFlow:
    when: { platform: Android }
    commands:
      - tapOn: "Sign out"
- extendedWaitUntil: { visible: "Text me the code", timeout: 15000 }
