# After a merge that touches the app: the same native code gets an update on
# the preview channel; new native code gets new preview builds.
name: deliver

on:
  push:
    branches: [main]
    paths: ["apps/mobile-consumer/**"]
  workflow_dispatch: {}

# One at a time with release, the newest waiting: two publishes never race,
# and an older commit never publishes last.
concurrency:
  group: mobile-publish
  queue: max

jobs:
  fingerprint:
    type: fingerprint
    environment: preview
    # The profile's own env (eas.json, a test keeps them equal): without it the
    # fingerprint is another variant's and no build is ever reused.
    env: &env
      APP_VARIANT: "preview"
      EXPO_PUBLIC_SUPABASE_URL: "https://yjalywfzdelacdzccpgb.supabase.co"
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_bQPhz9pZSTnVAW1aOZ6Q6g_imiiwTJd"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

  find_ios:
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: simulator
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  find_android:
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  build_ios:
    needs: [find_ios]
    if: ${{ !needs.find_ios.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: simulator

  build_android:
    needs: [find_android]
    if: ${{ !needs.find_android.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  update:
    needs: [find_ios, find_android]
    if: ${{ needs.find_ios.outputs.build_id || needs.find_android.outputs.build_id }}
    type: update
    environment: preview
    env: *env
    params:
      channel: preview
      platform: all
